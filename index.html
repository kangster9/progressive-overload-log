<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="운동 기록을 달력으로 정리하고 지난 기록과 비교하는 점진적 과부하 트래커">
<title>Progress Log — 운동 기록</title>
<style>
:root{--bg:#f4f5f1;--paper:#fff;--ink:#1e2923;--muted:#737d75;--line:#e5e9e2;--green:#315a45;--green2:#dbe9da;--lime:#d7f06b;--orange:#f5c5a7;--purple:#e4def5;--shadow:0 12px 30px #2337270a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1200px;margin:auto;padding:22px 24px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.04em}.logo{height:36px;width:36px;background:var(--green);color:#fff;border-radius:12px;display:grid;place-items:center;font-size:18px}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ink);font-weight:650;cursor:pointer}.btn:hover{border-color:#a9b8a6}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.monthbar{display:flex;justify-content:space-between;align-items:end;margin:0 0 18px}.monthbar h1{font-size:30px;letter-spacing:-.055em;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.monthnav{display:flex;align-items:center;gap:7px}.monthnav button{width:34px;height:34px;padding:0;font-size:18px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.85fr);gap:20px;align-items:start}.calendar,.detail{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.calendar{padding:18px}.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{margin-bottom:5px}.dow span{text-align:center;padding:8px 0;color:var(--muted);font-size:11px;font-weight:750}.day{min-height:87px;border:1px solid transparent;background:#fbfcf9;border-radius:12px;padding:8px;text-align:left;cursor:pointer;position:relative;color:var(--ink)}.day:hover{border-color:#b6c8b4}.day.out{background:transparent;color:#b0b8b0}.day.selected{border:1.5px solid var(--green);background:#f1f7ef}.day.today .num{background:var(--lime);border-radius:50%;font-weight:800}.num{width:25px;height:25px;display:grid;place-items:center;font-size:12px}.daylabel{display:block;font-size:10px;color:var(--green);font-weight:750;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dotrow{display:flex;gap:3px;margin-top:6px}.dot{width:5px;height:5px;border-radius:50%;background:var(--green)}.side{display:grid;gap:14px}.detail{padding:19px}.detail-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:13px}.detail h2{font-size:17px;letter-spacing:-.03em;margin:0}.detail-date{font-size:12px;color:var(--muted);margin-top:3px}.label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:13px 0 7px}.summary{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#f1f4ee;border-radius:20px;padding:5px 9px;font-size:11px;color:#56645a}.exercise{border-top:1px solid var(--line);padding:12px 0}.exercise:first-child{border-top:0}.exercise-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.exercise-name{font-size:13px;font-weight:750}.exercise-raw{font-size:11px;color:#56645a;white-space:pre-wrap}.note{font-size:11px;color:var(--muted);margin-top:4px}.compare{font-size:11px;margin-top:8px;padding:8px 9px;background:#f4f6ef;border-radius:9px;display:flex;gap:10px;flex-wrap:wrap}.up{color:#27744b;font-weight:750}.down{color:#aa5b3e;font-weight:750}.same{color:var(--muted)}.empty{color:var(--muted);font-size:13px;padding:14px 0}.form{display:grid;gap:10px}.form label{font-size:11px;color:var(--muted);font-weight:700;display:grid;gap:5px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;font-size:13px;background:#fff;color:var(--ink);outline:none}.form textarea{min-height:165px;resize:vertical}.form input:focus,.form textarea:focus{border-color:#8bac8d;box-shadow:0 0 0 3px #eef5e9}.hint{font-size:10px;color:var(--muted);margin-top:-5px}.exercise-editor{display:grid;gap:10px}.edit-exercise{border:1px solid var(--line);border-radius:13px;background:#fbfcf9;padding:11px}.edit-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}.bodyweight-check{display:flex!important;align-items:center;gap:5px!important;font-size:10px!important;white-space:nowrap}.bodyweight-check input{width:auto!important}.set-header{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 30px;gap:6px;margin:10px 0 5px;color:var(--muted);font-size:9px;text-align:center}.set-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 30px;gap:6px;margin-bottom:6px}.set-row input{text-align:center;padding:8px 4px!important}.edit-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.edit-foot .hint{margin:0}.icon-btn{width:30px;padding:5px!important;font-size:15px!important}.form input.exercise-input{font-weight:750}.form input.exercise-note{font-size:11px}.form .set-row input:focus{border-color:#8bac8d;box-shadow:0 0 0 3px #eef5e9}.form-actions{display:flex;gap:7px;justify-content:end}.progress{padding:18px 19px;background:var(--green);color:#fff;border-radius:18px}.progress h3{font-size:13px;margin:0 0 10px}.progress-list{display:grid;gap:8px}.progress-row{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#e5eee5}.progress-row b{color:#fff;text-align:right}.privacy{color:#8a948c;text-align:center;font-size:10px;margin:22px 0 0}.hide{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;transition:.2s;background:#172c20;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.app{padding:16px 12px 40px}.grid{grid-template-columns:1fr}.day{min-height:67px;padding:5px}.daylabel{font-size:9px}.top{margin-bottom:20px}.monthbar h1{font-size:25px}}@media(max-width:460px){.top-actions .btn{font-size:11px;padding:8px}.calendar{padding:10px}.dow,.days{gap:2px}.day{min-height:58px;padding:3px;border-radius:9px}.num{width:22px;height:22px;font-size:11px}.daylabel{font-size:8px}.monthbar{align-items:center}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><span class="logo">↗</span><span>운동 루틴</span></div><div class="top-actions"><button class="btn" id="exportBtn">백업 내보내기</button><button class="btn" id="importBtn">가져오기</button><input id="fileInput" type="file" accept="application/json" class="hide"></div></header>
<section class="monthbar"><div><h1 id="monthTitle"></h1><div class="sub">운동을 기록하고 지난 기록과 비교해보세요</div></div><div class="monthnav"><button class="btn" id="prevMonth" aria-label="이전 달">‹</button><button class="btn" id="todayBtn">오늘</button><button class="btn" id="nextMonth" aria-label="다음 달">›</button></div></section>
<div class="grid"><section class="calendar"><div class="dow"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div class="days" id="days"></div></section><aside class="side"><section class="detail" id="detail"></section><section class="progress"><h3>이번 달 요약</h3><div id="monthSummary" class="progress-list"></div></section></aside></div>
<p class="privacy">운동 기록은 이 브라우저에 저장됩니다. 공개 페이지에 기록이 올라가지 않으며, 다른 기기와 자동 동기화되지는 않습니다.</p>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const KEY='progress-log-v1', today=new Date();let month=new Date(today.getFullYear(),today.getMonth(),1), selected=iso(today);let state;try{state=JSON.parse(localStorage.getItem(KEY))||{sessions:{}}}catch{state={sessions:{}}}if(!state.sessions||typeof state.sessions!=='object')state={sessions:{}};
const $=id=>document.getElementById(id), months=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long'}), dateFmt=s=>new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date(s+'T12:00:00'));
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function h(s){return esc(s).replace(/\n/g,'<br>')}
function sessionsAt(date){return state.sessions[date]||[]}function render(){ $('monthTitle').textContent=months.format(month);renderCalendar();renderDetail();renderSummary()}
function renderCalendar(){const first=new Date(month.getFullYear(),month.getMonth(),1),offset=(first.getDay()+6)%7,start=new Date(first);start.setDate(first.getDate()-offset);let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),items=sessionsAt(key),split=items.map(x=>x.split).filter(Boolean).join(' · ');html+=`<button class="day ${d.getMonth()!==month.getMonth()?'out':''} ${key===selected?'selected':''} ${key===iso(today)?'today':''}" data-date="${key}"><span class="num">${d.getDate()}</span>${split?`<span class="daylabel">${esc(split)}</span><span class="dotrow">${items.slice(0,4).map(()=>'<i class="dot"></i>').join('')}</span>`:''}</button>`} $('days').innerHTML=html}
function parseSets(raw,name){const body=/풀업|턱걸이|친업|푸시업|푸쉬업|딥스|맨몸/i.test(name);return String(raw||'').split(/[\/,;]+/).map(x=>x.trim()).filter(Boolean).map(part=>{const s=part.replace(/kg/ig,'').replace(/총\s*/g,'').match(/\d+(?:\.\d+)?/g)||[];if(s.length>=3){return{kg:+s[0],reps:+s[1],sets:+s[2],body:false}}if(s.length===2&&body){return{kg:0,reps:+s[0],sets:+s[1],body:true}}if(s.length===2){return{kg:+s[0],reps:+s[1],sets:1,body:false}}if(s.length===1&&body){return{kg:0,reps:+s[0],sets:1,body:true}}if(s.length===1){return{kg:+s[0],reps:0,sets:1,body:false}}return null}).filter(Boolean)}
function stats(ex){const sets=Array.isArray(ex.sets)?ex.sets:parseSets(ex.raw,ex.name),loaded=sets.filter(s=>!s.body&&s.kg!=null&&s.reps>0),max=loaded.length?Math.max(...loaded.map(s=>s.kg)):null,vol=loaded.reduce((a,s)=>a+s.kg*s.reps*s.sets,0),reps=sets.reduce((a,s)=>a+s.reps*s.sets,0);return{max,vol,reps,sets:sets.reduce((a,s)=>a+s.sets,0)}}function formatSets(ex){const sets=Array.isArray(ex.sets)?ex.sets:parseSets(ex.raw,ex.name);if(!sets.length)return ex.raw||'기록 없음';return sets.map(s=>s.body?`맨몸 × ${s.reps}회 × ${s.sets}세트`:`${s.kg}kg × ${s.reps}회 × ${s.sets}세트`).join(' · ')}
function prevExercise(name,date){const dates=Object.keys(state.sessions).filter(d=>d<date).sort((a,b)=>b.localeCompare(a));for(const d of dates){for(const session of (state.sessions[d]||[])){const ex=session.exercises.find(x=>x.name.trim().toLowerCase()===name.trim().toLowerCase());if(ex)return{date:d,ex,session}}}return null}
function metric(label,a,b,suffix='',unit=''){if(a==null||b==null)return'';const diff=a-b,cls=diff>0?'up':diff<0?'down':'same',symbol=diff>0?'+':'';return `<span class="${cls}">${label} ${symbol}${trim(diff)}${unit}${suffix}</span>`}function trim(n){return Number(n.toFixed(1))}
function isBodyweight(name){return /풀업|턱걸이|친업|푸시업|푸쉬업|딥스|맨몸/i.test(name)}function addSetRow(list){const row=document.createElement('div');row.className='set-row';row.innerHTML='<input class="set-weight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg" aria-label="중량(kg)"><input class="set-reps" type="number" inputmode="numeric" min="1" step="1" placeholder="회" aria-label="횟수"><input class="set-count" type="number" inputmode="numeric" min="1" step="1" placeholder="세트" aria-label="세트"><button type="button" class="btn icon-btn" data-remove-set aria-label="세트 줄 삭제">×</button>';row.querySelector('[data-remove-set]').onclick=()=>{if(list.children.length>1)row.remove();else row.querySelectorAll('input').forEach(i=>i.value='')};list.append(row)}function createExerciseEditor(){const card=document.createElement('section');card.className='edit-exercise';card.innerHTML='<div class="edit-head"><input class="exercise-input" aria-label="운동 이름" maxlength="48" placeholder="예: 덤벨 프레스"><label class="bodyweight-check"><input class="bodyweight-input" type="checkbox"> 맨몸</label></div><input class="exercise-note" aria-label="운동 메모" placeholder="운동 메모 (선택)"><div class="set-header"><span>중량 (kg)</span><span>횟수</span><span>세트 수</span><span></span></div><div class="set-rows"></div><div class="edit-foot"><button type="button" class="btn" data-add-set>+ 세트 줄</button><button type="button" class="btn icon-btn" data-remove-exercise aria-label="운동 삭제">삭제</button></div>';const list=card.querySelector('.set-rows');addSetRow(list);const name=card.querySelector('.exercise-input'),body=card.querySelector('.bodyweight-input');name.oninput=()=>{if(isBodyweight(name.value))body.checked=true};card.querySelector('[data-add-set]').onclick=()=>addSetRow(list);card.querySelector('[data-remove-exercise]').onclick=()=>card.remove();return card}function renderDetail(){const items=sessionsAt(selected);const sessionsHTML=items.map((session,si)=>`<div><div class="detail-head"><div><h2>${esc(session.split||'운동')}</h2><div class="detail-date">${dateFmt(selected)}</div></div><button class="btn" data-delete="${si}">삭제</button></div><div class="summary"><span class="pill">${session.exercises.length}종목</span><span class="pill">${session.exercises.reduce((a,x)=>a+stats(x).sets,0)}세트</span></div>${session.exercises.map(ex=>{const st=stats(ex),prev=prevExercise(ex.name,selected),ps=prev?stats(prev.ex):null;let compare=prev?`${metric('최고 중량',st.max,ps.max,'','kg')} ${metric('볼륨',st.vol,ps.vol,'','kg')} ${metric('총 반복',st.reps,ps.reps,'','회')}`:`<span class="same">비교 기록이 없어요 · 첫 기록</span>`;return `<article class="exercise"><div class="exercise-top"><span class="exercise-name">${esc(ex.name)}</span><span class="exercise-raw">${esc(formatSets(ex))}</span></div>${ex.note?`<div class="note">${esc(ex.note)}</div>`:''}<div class="compare">${prev?`<span class="same">이전 ${dateFmt(prev.date)}</span>`:''}${compare}</div></article>`}).join('')}${session.note?`<p class="note">${esc(session.note)}</p>`:''}</div>`).join('');
$('detail').innerHTML=`<div class="detail-head"><div><h2>${dateFmt(selected)}</h2><div class="detail-date">기록은 이 기기에 자동 저장</div></div><button class="btn primary" id="addBtn">+ 기록</button></div>${sessionsHTML||'<div class="empty">이 날짜에는 기록이 없어요.<br>운동을 추가해보세요.</div>'}<form class="form hide" id="sessionForm"><label>분할 / 부위<input name="split" maxlength="24" placeholder="예: 어깨, 등, 가슴"></label><div><div class="label">운동 기록</div><div class="exercise-editor" id="exerciseEditors"></div><button type="button" class="btn" id="addExerciseBtn">+ 운동 추가</button><div class="hint">중량·횟수·세트를 각각 입력하세요. 중량이나 횟수가 다르면 세트 줄을 추가하면 돼요.</div></div><label>오늘 메모<input name="note" placeholder="선택 입력"></label><div class="form-actions"><button type="button" class="btn" id="cancelBtn">취소</button><button class="btn primary" type="submit">저장</button></div></form>`;
$('addBtn').onclick=()=>{$('sessionForm').classList.remove('hide');$('addBtn').classList.add('hide');$('exerciseEditors').append(createExerciseEditor());$('sessionForm').elements.split.focus()};$('addExerciseBtn').onclick=()=>{$('exerciseEditors').append(createExerciseEditor());$('exerciseEditors').lastElementChild.querySelector('.exercise-input').focus()};$('cancelBtn').onclick=()=>renderDetail();$('sessionForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),exs=[];for(const card of $('exerciseEditors').querySelectorAll('.edit-exercise')){const name=card.querySelector('.exercise-input').value.trim(),note=card.querySelector('.exercise-note').value.trim(),body=card.querySelector('.bodyweight-input').checked,sets=[];if(!name)continue;for(const row of card.querySelectorAll('.set-row')){const w=row.querySelector('.set-weight').value,r=row.querySelector('.set-reps').value,n=row.querySelector('.set-count').value;if(!w&&!r&&!n)continue;if(!r||!n||(!body&&!w)){toast('각 세트 줄에 중량·횟수·세트를 입력해주세요. 맨몸은 중량을 비워 두면 돼요.');return}const reps=Number(r),count=Number(n),kg=body?null:Number(w);if(reps<=0||count<=0||!Number.isInteger(count)||(!body&&kg<0)){toast('중량, 횟수, 세트 수를 확인해주세요.');return}sets.push({kg,reps,sets:count,body})}const raw=sets.map(s=>s.body?`${s.reps}-${s.sets}`:`${s.kg}-${s.reps}-${s.sets}`).join(', ');exs.push({name,raw,note,sets})}if(!exs.length){toast('운동 이름을 하나 이상 입력해주세요.');return}const arr=sessionsAt(selected);arr.push({split:String(f.get('split')||'운동').trim(),note:String(f.get('note')||'').trim(),exercises:exs});state.sessions[selected]=arr;save();render();toast('운동 기록을 저장했어요.')};$('detail').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('이 날짜의 운동 기록을 삭제할까요?')){const a=sessionsAt(selected);a.splice(+b.dataset.delete,1);if(!a.length)delete state.sessions[selected];save();render()}})}
function renderSummary(){const keys=Object.keys(state.sessions).filter(d=>d.slice(0,7)===iso(month).slice(0,7)),days=keys.length,workouts=keys.reduce((a,d)=>a+state.sessions[d].length,0),exercises=keys.reduce((a,d)=>a+state.sessions[d].reduce((n,s)=>n+s.exercises.length,0),0);$('monthSummary').innerHTML=`<div class="progress-row"><span>운동한 날</span><b>${days}일</b></div><div class="progress-row"><span>운동 기록</span><b>${workouts}회</b></div><div class="progress-row"><span>운동 종목</span><b>${exercises}개</b></div>`}
$('days').onclick=e=>{const b=e.target.closest('[data-date]');if(!b)return;selected=b.dataset.date;month=new Date(selected+'T12:00:00');render()};$('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};$('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};$('todayBtn').onclick=()=>{month=new Date(today.getFullYear(),today.getMonth(),1);selected=iso(today);render()};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='progress-log-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const v=JSON.parse(await file.text());if(!v.sessions||typeof v.sessions!=='object')throw Error();if(confirm('현재 기록을 가져온 기록으로 교체할까요?')){state=v;save();render();toast('기록을 가져왔어요.')}}catch{toast('올바른 백업 파일이 아니에요.')}e.target.value=''};
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}render();
})();
</script>
</body></html>
